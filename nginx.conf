server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  charset utf-8;
  charset_types text/css text/plain text/markdown application/javascript application/json image/svg+xml;

  gzip on;
  gzip_vary on;
  gzip_proxied any;
  gzip_comp_level 6;
  gzip_min_length 512;
  gzip_types text/css application/javascript application/json image/svg+xml text/plain text/markdown application/xml application/manifest+json;

  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header X-Frame-Options "SAMEORIGIN" always;

  # www.kitr.dev → kitr.dev
  if ($host ~* ^www\.(.+)$) {
    return 301 https://$1$request_uri;
  }

  # Short paths people type or guess. The pages live under /docs.
  location = /kits {
    return 301 /docs/kits;
  }
  location = /getting-started {
    return 301 /docs/getting-started;
  }
  location = /compare {
    return 301 /docs/compare;
  }

  # Real 404s, with the prerendered not-found page.
  error_page 404 /404.html;
  location = /404.html {
    internal;
    add_header Cache-Control "no-cache" always;
  }

  # Every page as markdown at <url>.md, plus llms.txt, for agents.
  location ~ \.md$ {
    default_type text/markdown;
    types {}
    add_header Cache-Control "public, max-age=300" always;
    try_files $uri =404;
  }

  # Hashed build output never changes.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header X-Content-Type-Options "nosniff" always;
    try_files $uri =404;
  }

  location /og/ {
    add_header Cache-Control "public, max-age=86400" always;
    try_files $uri =404;
  }

  location = /site.webmanifest {
    default_type application/manifest+json;
    try_files $uri =404;
  }

  # Prerendered pages live at <path>/index.html.
  location / {
    add_header Cache-Control "public, max-age=0, must-revalidate" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    try_files $uri $uri/index.html $uri.html =404;
  }
}
